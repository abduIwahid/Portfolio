<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AW Logo Preview</title>
<style>
  body { margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #f0f0f0; gap: 40px; font-family: sans-serif; padding: 40px 20px; box-sizing: border-box; }
  .row { display: flex; align-items: flex-end; gap: 36px; flex-wrap: wrap; justify-content: center; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  label { font-size: 10px; color: #888; letter-spacing: .08em; text-transform: uppercase; }
  h2 { margin: 0 0 4px; font-size: 13px; color: #333; letter-spacing: .04em; }
</style>
</head>
<body>

<h2>AW Monoline Logo — Connected Single Stroke</h2>

<div class="row">
  <!-- 32px — favicon in tab -->
  <div class="card">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32">
      <rect width="64" height="64" rx="13" fill="#171717"/>
      <path d="M 28 20 A 11 11 0 1 0 28 40 C 35 36 42 46 46 30 C 50 18 54 44 58 26"
            fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="58" cy="17" r="2.8" fill="#f97316"/>
    </svg>
    <label>32 px</label>
  </div>

  <!-- 48px -->
  <div class="card">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
      <rect width="64" height="64" rx="13" fill="#171717"/>
      <path d="M 28 20 A 11 11 0 1 0 28 40 C 35 36 42 46 46 30 C 50 18 54 44 58 26"
            fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="58" cy="17" r="2.8" fill="#f97316"/>
    </svg>
    <label>48 px</label>
  </div>

  <!-- 64px — favicon actual -->
  <div class="card">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
      <rect width="64" height="64" rx="13" fill="#171717"/>
      <path d="M 28 20 A 11 11 0 1 0 28 40 C 35 36 42 46 46 30 C 50 18 54 44 58 26"
            fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="58" cy="17" r="2.8" fill="#f97316"/>
    </svg>
    <label>64 px (favicon)</label>
  </div>

  <!-- 128px -->
  <div class="card">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
      <rect width="64" height="64" rx="13" fill="#171717"/>
      <path d="M 28 20 A 11 11 0 1 0 28 40 C 35 36 42 46 46 30 C 50 18 54 44 58 26"
            fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="58" cy="17" r="2.8" fill="#f97316"/>
    </svg>
    <label>128 px</label>
  </div>

  <!-- 256px -->
  <div class="card">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
      <rect width="64" height="64" rx="13" fill="#171717"/>
      <path d="M 28 20 A 11 11 0 1 0 28 40 C 35 36 42 46 46 30 C 50 18 54 44 58 26"
            fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="58" cy="17" r="2.8" fill="#f97316"/>
    </svg>
    <label>256 px</label>
  </div>
</div>

<!-- Light variant -->
<div class="row">
  <div class="card">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
      <rect width="64" height="64" rx="13" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
      <path d="M 28 20 A 11 11 0 1 0 28 40 C 35 36 42 46 46 30 C 50 18 54 44 58 26"
            fill="none" stroke="#171717" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="58" cy="17" r="2.8" fill="#f97316"/>
    </svg>
    <label>Light variant</label>
  </div>

  <!-- Header simulation -->
  <div class="card">
    <div style="display:flex;align-items:center;gap:10px;background:#f8f8f8;padding:14px 20px;border-radius:8px;border:1px solid #e5e5e5;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="38" height="38">
        <rect width="64" height="64" rx="13" fill="#171717"/>
        <path d="M 28 20 A 11 11 0 1 0 28 40 C 35 36 42 46 46 30 C 50 18 54 44 58 26"
              fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="58" cy="17" r="2.8" fill="#f97316"/>
      </svg>
      <div style="display:flex;flex-direction:column;gap:3px;">
        <span style="font-size:14px;font-weight:700;letter-spacing:-.02em;color:#171717;">Abdul Wahid</span>
        <span style="font-size:10px;color:#888;letter-spacing:.04em;text-transform:uppercase;">AI/ML Developer</span>
      </div>
    </div>
    <label>Header simulation</label>
  </div>

  <!-- Dark header simulation -->
  <div class="card">
    <div style="display:flex;align-items:center;gap:10px;background:#171717;padding:14px 20px;border-radius:8px;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="38" height="38">
        <rect width="64" height="64" rx="13" fill="#171717"/>
        <path d="M 28 20 A 11 11 0 1 0 28 40 C 35 36 42 46 46 30 C 50 18 54 44 58 26"
              fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="58" cy="17" r="2.8" fill="#f97316"/>
      </svg>
      <div style="display:flex;flex-direction:column;gap:3px;">
        <span style="font-size:14px;font-weight:700;letter-spacing:-.02em;color:#f5f5f5;">Abdul Wahid</span>
        <span style="font-size:10px;color:#888;letter-spacing:.04em;text-transform:uppercase;">AI/ML Developer</span>
      </div>
    </div>
    <label>Dark header</label>
  </div>
</div>

</body>
</html>
