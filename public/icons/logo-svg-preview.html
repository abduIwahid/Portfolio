<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Logo SVG Preview</title>
<style>
  body { margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f0f0f0; gap: 40px; flex-wrap: wrap; font-family: sans-serif; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  label { font-size: 10px; color: #888; letter-spacing: .08em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/logo.svg" width="400" height="400" alt="Full logo SVG"/>
    <label>Full logo.svg (400×400)</label>
  </div>
  <div class="card" style="background:#333;padding:20px;border-radius:12px;">
    <img src="/icons/logo.svg" width="400" height="400" alt="On dark"/>
    <label style="color:#aaa;">On dark background</label>
  </div>
</body>
</html>
